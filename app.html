<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>First Line AI</title>
<meta name="theme-color" content="#EAF0FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="First Line">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF0FA; --ground:#E3E9F3; --gp:#F3F6FB; --card:#FFFFFF; --ink:#111826; --muted:#69758A;
    --accent:#3D6BF3; --soft:#E4ECFD; --line:#E4EAF4; --wash:#F0F4FD;
    --green:#2EA36B; --green-s:#E2F4EA; --red:#E14B3B; --red-s:#FCE9E5; --amber:#C97F16; --amber-s:#FDF3E2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ground);color:var(--ink);font-family:'Outfit',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,textarea{font-family:inherit}

  .top{height:64px;display:flex;align-items:center;padding:0 28px;gap:18px;background:#fff;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
  .brand i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#4E7DF8,#3D63E8);display:inline-block}
  .seg{margin-left:auto;display:flex;background:var(--sky);border-radius:999px;padding:4px}
  .seg button{border:0;background:transparent;padding:9px 20px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted)}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(17,24,38,.08);font-weight:600}
  .scen{display:flex;gap:8px;margin-left:16px}
  .scen button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;color:var(--muted)}
  .scen button:hover{border-color:var(--accent);color:var(--accent)}

  .stage{height:calc(100vh - 64px);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:12px}
  .hidden{display:none !important}
  .fit{transform-origin:center center;flex:none}

  .frame{width:430px;padding:20px;border-radius:32px;background:linear-gradient(180deg,#D8E4F7,#EAF0FA)}
  .phone{width:390px;height:844px;background:#111;border-radius:48px;padding:10px;position:relative}
  .glass{width:100%;height:100%;border-radius:40px;background:var(--sky);position:relative;overflow:hidden}
  .island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:110px;height:32px;background:#111;border-radius:20px;z-index:5}
  .scr{position:absolute;inset:0;overflow-y:auto;padding:64px 20px 108px}
  .scr::-webkit-scrollbar{display:none}

  .hdr{display:flex;align-items:center;gap:12px}
  .av{width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
  .hdr .t{font-size:19px;font-weight:600;line-height:1.15}
  .hdr .d{font-size:13px;color:var(--muted);margin-top:1px}
  .bell{margin-left:auto;width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}

  .hero{margin-top:16px;border-radius:20px;background:linear-gradient(135deg,#4E7DF8,#3D63E8);padding:18px;color:#fff;box-shadow:0 10px 24px rgba(61,99,232,.28)}
  .pill{display:inline-flex;align-items:center;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:500;background:rgba(255,255,255,.18)}
  .hero .m{margin-top:10px;font-size:16px;font-weight:500;line-height:1.45}
  .hero .s{margin-top:6px;font-size:13px;color:rgba(255,255,255,.85)}

  .sec{display:flex;align-items:baseline;margin-top:20px}
  .sec b{font-size:16px;font-weight:600}.sec span{margin-left:auto;font-size:13px;color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
  .tile{border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:0 2px 10px rgba(20,40,80,.05);padding:16px 12px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer}
  .tile .ic{width:56px;height:56px;border-radius:50%;background:var(--wash);display:flex;align-items:center;justify-content:center}
  .tile .n{font-size:15.5px;font-weight:600;margin-top:10px;line-height:1.2}
  .tile .u{font-size:13px;color:var(--muted);margin-top:1px}
  .chip{margin-top:10px;font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--soft);color:var(--accent)}

  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 2px 10px rgba(20,40,80,.05);margin-top:12px}
  .card h3{font-size:16px;font-weight:600;line-height:1.25}
  .card p{font-size:14.5px;line-height:1.5;color:var(--ink);margin-top:6px}
  .card .cap{font-size:12.5px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  .rowc{display:flex;align-items:center;gap:12px;cursor:pointer}
  .rowc .tl{width:38px;height:38px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none}
  .rowc .tx{flex:1;font-size:15px;font-weight:500}.rowc .tx small{display:block;font-size:13px;color:var(--muted);font-weight:400;margin-top:1px}

  .h1{font-size:24px;font-weight:600;letter-spacing:-.2px;margin-top:18px;line-height:1.2}
  .lead{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.5}
  .back{border:0;background:none;color:var(--accent);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:4px;margin-top:2px}

  .btn{display:flex;align-items:center;justify-content:center;height:46px;border-radius:999px;border:0;font-size:14.5px;font-weight:600;width:100%;text-decoration:none;margin-top:10px}
  .btn.p{background:var(--accent);color:#fff}
  .btn.w{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.r{background:var(--red);color:#fff}
  .btn.ro{background:#fff;color:var(--red);border:1.5px solid var(--red)}
  .two{display:flex;gap:10px}.two .btn{flex:1}

  .field{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px}
  .field label{display:block;font-size:12px;color:var(--muted);font-weight:500}
  .field input,.field textarea{width:100%;border:0;outline:0;font-size:15.5px;padding:4px 0;background:none;resize:none}

  .entry{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .entry:first-child{border-top:0}
  .entry .dot{width:12px;height:12px;border-radius:50%;background:var(--green);margin-top:5px;flex:none}
  .entry .w{flex:1}.entry .w b{font-weight:600;font-size:15px}.entry .w span{color:var(--muted);font-size:13px;margin-left:6px}
  .entry .q{margin-top:6px;background:var(--wash);border-radius:10px;padding:8px 11px;font-size:13.5px;font-style:italic;line-height:1.45}

  .ask{display:flex;gap:8px;margin-top:14px}
  .ask input{flex:1;height:48px;border:1px solid var(--line);border-radius:999px;padding:0 18px;font-size:15px;background:#fff;outline:0}
  .ask input:focus{border-color:var(--accent)}
  .ask button{width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-size:13px;color:var(--ink)}
  .chips button:hover{border-color:var(--accent);color:var(--accent)}
  .gate{border-color:#F6C9C2;background:#FFF7F6}
  .gate h3{color:var(--red)}

  .flag{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.45;align-items:flex-start}
  .flag:first-of-type{border-top:0}
  .flag .k{margin-left:auto;flex:none;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--red-s);color:var(--red);white-space:nowrap}
  .bub{max-width:82%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.45;margin-top:8px}
  .bub.me{margin-left:auto;background:var(--accent);color:#fff;border-bottom-right-radius:6px}
  .bub.th{background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
  .lock{filter:grayscale(1);opacity:.5;pointer-events:none}

  .nav{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;display:flex;gap:22px;align-items:center;background:#fff;border-radius:999px;padding:12px 22px;box-shadow:0 8px 24px rgba(17,24,38,.14);border:1px solid var(--line);z-index:4}
  .nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:#9AA6B8;padding:0 2px}
  .nav button.on{color:var(--accent)}
  .nav button .d{width:4px;height:4px;border-radius:50%;background:transparent;display:block}
  .nav button.on .d{background:var(--accent)}
  .toast{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;box-shadow:0 8px 24px rgba(17,24,38,.25);opacity:0;transition:.2s;pointer-events:none;z-index:6}
  .toast.show{opacity:1}

  .gpwrap{width:1440px;max-width:100%;height:860px;background:var(--gp);border-radius:12px;box-shadow:0 2px 16px rgba(17,24,38,.10);display:flex;overflow:hidden}
  .list{width:340px;flex:none;border-right:1px solid var(--line);background:#fff;display:flex;flex-direction:column}
  .list h2{font-size:13px;font-weight:600;color:var(--muted);padding:22px 22px 10px}
  .prow{display:flex;align-items:center;gap:12px;padding:12px 22px;cursor:pointer;border-left:3px solid transparent}
  .prow:hover{background:var(--gp)}
  .prow.on{background:var(--wash);border-left-color:var(--accent)}
  .prow .av{width:36px;height:36px;font-size:13px}
  .prow .nm{font-size:14.5px;font-weight:600}.prow .mt{font-size:12.5px;color:var(--muted);margin-top:1px}
  .prow .bd{margin-left:auto;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--red-s);color:var(--red);white-space:nowrap}
  .prow .bd.b{background:var(--soft);color:var(--accent)}
  .list .foot{margin-top:auto;padding:16px 22px;font-size:12px;color:var(--muted);line-height:1.55;border-top:1px solid var(--line)}
  .detail{flex:1;min-width:0;padding:26px 32px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;font-size:14px}
  .dh{display:flex;align-items:center;gap:14px}
  .dh .t{font-size:20px;font-weight:600;line-height:1.1}.dh .m{color:var(--muted);font-size:13.5px;margin-top:2px}
  .stats{margin-left:auto;display:flex;gap:10px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 16px;min-width:118px}
  .stat .l{font-size:11.5px;color:var(--muted)}.stat .v{font-size:17px;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}
  .gcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 20px}
  .gcard .ttl{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:8px}
  .gcols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .words{background:var(--wash);border-radius:10px;padding:10px 12px;font-style:italic;line-height:1.5;margin-top:8px;font-size:14px}
  .words small{display:block;font-style:normal;color:var(--muted);font-size:12px;margin-top:4px}
  .trow{display:flex;gap:14px;align-items:flex-start;padding:10px 0;border-top:1px solid #EDF1F8;font-size:13.5px}
  .trow:first-of-type{border-top:0}
  .trow .when{width:110px;flex:none;color:var(--muted)}
  .trow .what{flex:1;min-width:0;line-height:1.45}
  .tag{flex:none;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .tag.lib{background:var(--green-s);color:var(--green)}.tag.gate{background:var(--red-s);color:var(--red)}.tag.miss{background:var(--amber-s);color:var(--amber)}
  .weeks{display:flex;gap:6px;align-items:center}
  .wk{width:22px;height:22px;border-radius:50%}
  .wk.on{background:var(--green)}.wk.off{border:2px solid #D4DBE6}.wk.now{border:2px solid var(--accent)}
  .legend{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;gap:6px;align-items:center}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .pbtn{height:30px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:12.5px;white-space:nowrap}
  .pbtn:hover{border-color:var(--accent);color:var(--accent)}
  .pbtn.done{background:var(--soft);color:var(--accent);border-color:var(--soft)}
  .chatq{display:flex;flex-direction:column}
  .cin{display:flex;gap:8px;margin-top:10px}
  .cin input{flex:1;height:38px;border:1px solid var(--line);border-radius:999px;padding:0 14px;font-size:13.5px;outline:0}
  .cin button{height:38px;padding:0 16px;border-radius:999px;border:0;background:var(--accent);color:#fff;font-weight:600;font-size:13px}
  .note{font-size:12.5px;color:var(--muted);line-height:1.55}
  .gtoast{position:fixed;right:28px;bottom:24px;background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;box-shadow:0 8px 24px rgba(17,24,38,.25);opacity:0;transition:.2s;pointer-events:none}
  .gtoast.show{opacity:1}

  .proto{position:fixed;right:20px;bottom:16px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:12.5px;color:var(--muted);box-shadow:0 8px 24px rgba(17,24,38,.10);z-index:50;display:flex;gap:14px;align-items:center;white-space:nowrap}
  .proto b{color:var(--ink);font-weight:600}
  .proto a{color:var(--accent);text-decoration:none;font-weight:500}

  .scen{display:none}
  body.demo .scen{display:flex}
  .hint{margin-top:14px;background:#fff;border:1px dashed #C9D4EA;border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.5;color:var(--muted);display:flex;gap:10px;align-items:flex-start}
  .hint b{color:var(--ink);font-weight:600}
  .hint button{margin-left:auto;border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;flex:none}
  body.embed .proto{display:none}
  body.embed .brand{opacity:.75}
  .top .tag-proto{display:none}
  @media (max-width:700px){
    .top{height:52px;padding:0 14px;gap:10px}
    .brand{font-size:14.5px;gap:8px}
    .brand span{display:none}
    .brand i{width:22px;height:22px;border-radius:7px}
    .top .tag-proto{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:11px;font-weight:600}
    .seg button{padding:7px 13px;font-size:13px}
    .stage{height:calc(100dvh - 52px);padding:0;align-items:stretch;justify-content:stretch}
    .frame{width:100%;padding:0;border-radius:0;background:none;transform:none !important}
    .phone{width:100%;height:calc(100dvh - 52px);background:none;border-radius:0;padding:0}
    .glass{border-radius:0}
    .island{display:none}
    .scr{padding:18px 18px 110px}
    .proto{display:none}
    /* clinician view, stacked for a phone */
    .gpwrap{transform:none !important;width:100%;height:calc(100dvh - 52px);border-radius:0;box-shadow:none;flex-direction:column;background:var(--gp)}
    .list{width:100%;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;align-items:center;gap:8px;padding:10px 14px;overflow-x:auto;flex:none}
    .list::-webkit-scrollbar{display:none}
    .list h2,.list .foot{display:none}
    #plist{display:flex;gap:8px}
    .prow{flex:none;border:1px solid var(--line);border-left:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;background:#fff;gap:8px}
    .prow.on{border-color:var(--accent);background:var(--wash)}
    .prow .av{width:28px;height:28px;font-size:11px}
    .prow .nm{font-size:13.5px}.prow .mt{display:none}
    .prow .bd{margin-left:4px;font-size:10.5px;padding:2px 7px}
    .detail{padding:14px 14px 40px;gap:12px}
    .dh{flex-wrap:wrap;gap:10px}
    .dh .t{font-size:18px}.dh .m{font-size:12.5px}
    .stats{margin-left:0;width:100%;overflow-x:auto;gap:8px}
    .stats::-webkit-scrollbar{display:none}
    .stat{min-width:104px;padding:8px 12px}
    .gcols{grid-template-columns:1fr;gap:12px}
    .gcard{padding:12px 14px}
    .trow{gap:10px;flex-wrap:wrap}
    .trow .when{width:100%;font-size:12px}
    .trow .what{flex:1 1 60%}
    .weeks{flex-wrap:wrap}
  }
</style>
</head>
<body>

<div class="top">
  <div class="brand"><i></i><span>First Line AI</span></div><span class="tag-proto">Prototype</span>
  <div class="scen">
    <button onclick="scenario('routine')">Routine question</button>
    <button onclick="scenario('gate')">Symptom → gate</button>
    <button onclick="scenario('diary')">Log a dose</button>
    <button onclick="location.reload()">Reset</button>
  </div>
  <div class="seg" id="seg">
    <button class="on" data-v="patient">Patient</button>
    <button data-v="clinician">Clinician</button>
  </div>
</div>

<div class="stage">

  <div id="patient" class="frame fit">
    <div class="phone"><div class="glass">
      <div class="island"></div>
      <div class="scr" id="scr"></div>
      <div class="nav" id="nav">
        <button data-s="home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V21h-6v-6h-6v6H3z"/></svg><i class="d"></i></button>
        <button data-s="diary"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="4.5" y="9" width="15" height="7" rx="3.5" transform="rotate(-45 12 12.5)"/><path d="M8.5 15.5 15.5 8.5"/></svg><i class="d"></i></button>
        <button data-s="guide"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 19a2 2 0 0 1 2-2h14"/></svg><i class="d"></i></button>
        <button data-s="ask"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4l1.6-3.2A8 8 0 1 1 21 12z"/></svg><i class="d"></i></button>
        <button data-s="help"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/><path d="M12 8v5"/><path d="M12 16.5v.5"/></svg><i class="d"></i></button>
      </div>
      <div class="toast" id="toast"></div>
    </div></div>
  </div>

  <div id="clinician" class="gpwrap fit hidden">
    <div class="list">
      <h2>Patients on GLP-1, Bramley Health Centre</h2>
      <div id="plist"></div>
    </div>
    <div class="detail" id="detail"></div>
  </div>

</div>
<div class="proto"><b>Prototype for feedback</b><span>Not medical advice. Content is illustrative</span><a href="FEEDBACK_FORM_URL" target="_blank" rel="noopener">Give feedback</a><a href="BOOKING_URL" target="_blank" rel="noopener">Book 20 min</a></div>
<div class="gtoast" id="gtoast"></div>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));
const nowT = () => new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});

const LIB_SRC = 'Patient information leaflet, v3 · approved 14 Aug 2026';
const LIBRARY = [
  { q:'Can I drink alcohol?', k:['alcohol','drink','wine','beer'], a:'A small amount is usually fine, but alcohol can make nausea worse and can lower blood sugar if you also take other diabetes medicines. Eat something if you do drink.' },
  { q:'Do I need to keep it in the fridge?', k:['fridge','store','storage','cold','temperature'], a:'Keep unused pens in the fridge. Once a pen is in use it can be kept at room temperature for up to 21 days. Don\u2019t freeze it.' },

function lookup(text){
  const low = text.toLowerCase();
  if (GATE.some(g => low.includes(g))) return { gate:true };
  const hit = LIBRARY.find(l => l.q.toLowerCase() === low) || LIBRARY.find(l => l.k.some(k => low.includes(k)));
  return hit ? { hit } : { miss:true };
}
window.askText = text => {
  const r = lookup(text);
  me().asks.push({ when:'Today ' + nowT(), q:text, kind: r.gate ? 'gate' : r.hit ? 'lib' : 'miss' });
  go('ask', r.gate ? gateCard() : r.hit ? answerCard(r.hit) : missCard());
  const q = $('q'); if (q) q.value = text;
  renderGP();
};
window.ask = () => { const q = $('q'); if (q && q.value.trim()) askText(q.value.trim()); };

  showView('patient');
  if (which === 'routine'){ go('ask'); await wait(500); await typeInto('q','Do I need to keep it in the fridge?'); await wait(400); ask(); }
  if (which === 'gate'){ go('ask'); await wait(500); await typeInto('q','I\u2019ve had bad stomach pain since yesterday'); await wait(500); ask(); await wait(1800); go('chat'); await wait(500); await typeInto('cq','The pain is under my ribs and it won\u2019t go away'); await wait(300); chatSend(); await wait(1200); showView('clinician'); }
  if (which === 'diary'){ go('log'); await wait(500); await typeInto('ln','Felt queasy for an hour after, then fine.'); await wait(400); saveLog(); await wait(900); showView('clinician'); }
};


/* ---- scale views to fit the viewport ---- */
function fit(){
  const P = $('patient'), C = $('clinician');
  if (window.innerWidth <= 700){ P.style.transform = ''; C.style.transform = ''; return; }
  const avail = { w: window.innerWidth - 24, h: window.innerHeight - 64 - 24 };
  const s1 = Math.min(1, avail.w / 430, avail.h / 884);
  P.style.transform = `scale(${s1})`;
  const s2 = Math.min(1, avail.w / 1440, avail.h / 860);
  C.style.transform = `scale(${s2})`;
}
window.addEventListener('resize', fit);
fit();

go('home'); renderGP();
if (location.hash === '#clinician') showView('clinician');
})();
